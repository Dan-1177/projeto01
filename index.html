
<!DOCTYPE html> <!-- Essa deve ser a primeira linha do código. DOCTYPE não é uma
tag. Na realidade, refere a uma instrução do seu documento para o navegador
saber como deverá mostrar o site da melhor maneira possível. É essencial deixar
definido que o DOCTYPE é obrigatório e deve ser colocado sempre na primeira
linha. -->
<html lang="en"> <!-- O documento sempre iniciará com essa tag. -->
<head> <!-- A tag head funciona como um cabeçalho, normalmente todas as
linkagens são colocadas aqui, entre a abertura e o fechamento da própria
tag.-->
    <meta charset="UTF-8"> <!--Definição de caracteres de leitura da pagina-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Definição de responsividade-->
    <title>Pagina prin</title>
</head> <!-- O documento sempre iniciará com essa tag. -->
<body bgcolor="#005b77"> <!-- Aqui será o corpo da página. -->
    <h1>Danilo</h1>

    O que define um texto?
    Sentido: precisa formar uma ideia clara.<br>
    Comunicação: serve para ligar quem escreve a quem lê.
    <hr>livre: pode ter uma só palavra ou várias páginas.</hr> <!-- tag <hr> = Linha Horizontal. -->
    <!--Desenvolvimento de pagina HTML-->
    <h1>Danilo</h1><br>

    <b>Danilo</b> <!--negrito-->
    <big>Danilo</big> <!-- grande-->
    <em>Danilo</em>
    <i>Danilo</i>
    <small>Danilo</small>
    <strong>Danilo</strong>
    <sub>Danilo</sub>
    <sup>Danilo</sup>
    <ins>Danilo</ins>
    <del>Danilo</del>


    &nbsp;  <!-- espaço não separavel-->
    &#160;  <!-- espaço não separavel-->
    &lt;  <!-- < menor do que-->
    &#60; <!-- < menor do que-->
    &gt; <!-- > menor do que-->
    &#62; <!-- > menor do que-->
    &amp; <!-- < & e comercial-->
    &#38; <!-- < & e comercial-->
    &quot <!-- < " aspas-->
    &#34; <!-- < " aspas-->



</body>
</html> <!-- O documento sempre fechará com essa tag. -->
